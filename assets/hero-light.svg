<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 440" preserveAspectRatio="xMidYMid meet" role="img" aria-label="magpie-cloudflare-workers-ai — Cloudflare Workers AI provider plugin for OpenCode and magpie">
  <defs>
