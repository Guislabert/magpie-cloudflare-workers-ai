  <text x="100" y="415" font-family="'Inter','SF Pro Text',sans-serif" font-size="14" fill="#475569">plugin add github:Guislabert/magpie-cloudflare-workers-ai &#160;&#8226;&#160; 28+ @cf models &#160;&#8226;&#160; zero npm &#160;&#8226;&#160; llms.txt for agents</text>
